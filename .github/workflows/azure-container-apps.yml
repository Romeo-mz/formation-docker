name: Build and deploy to Azure Container Apps

"on":
  push:
    branches:
      - azure_deploy
      - feature/prepare-formation
    paths:
      - "vote/**"
      - "result/**"
      - "worker/**"
      - ".github/workflows/azure-container-apps.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_TAG: ${{ github.sha }}
  # Replace these placeholders with GitHub repository variables/secrets during the TP.
  # Example: ACR_LOGIN_SERVER can become ${{ vars.ACR_LOGIN_SERVER }} once the variable exists.
  AZURE_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
  AZURE_TENANT_ID: "00000000-0000-0000-0000-000000000000"
  AZURE_SUBSCRIPTION_ID: "00000000-0000-0000-0000-000000000000"
  AZURE_RESOURCE_GROUP: "rg-formation-vote"
  AZURE_LOCATION: "westeurope"
  ACR_NAME: "acrformationvote"
  ACR_LOGIN_SERVER: "acrformationvote.azurecr.io"
  ACR_USERNAME: "CHANGE_ME"
  ACR_PASSWORD: "CHANGE_ME"
  CONTAINERAPPS_ENVIRONMENT: "cae-formation-vote"
  VOTE_APP_NAME: "ca-vote"
  RESULT_APP_NAME: "ca-result"
  WORKER_APP_NAME: "ca-worker"
  REDIS_CONNECTION_STRING: "redis://CHANGE_ME:6379"
  POSTGRES_CONNECTION_STRING: "Server=CHANGE_ME;Username=CHANGE_ME;Password=CHANGE_ME;Database=postgres;Ssl Mode=Require;"
  DATABASE_URL: "postgres://CHANGE_ME:CHANGE_ME@CHANGE_ME/postgres?sslmode=require"

jobs:
  build-push-deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # OIDC authentication is recommended for training and production:
      # no long-lived Azure password is stored in GitHub.
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps extension is installed
        run: az extension add --name containerapp --upgrade

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build images
        run: |
          VOTE_IMAGE="$ACR_LOGIN_SERVER/vote:$IMAGE_TAG"
          RESULT_IMAGE="$ACR_LOGIN_SERVER/result:$IMAGE_TAG"
          WORKER_IMAGE="$ACR_LOGIN_SERVER/worker:$IMAGE_TAG"

          docker build --target final -t "$VOTE_IMAGE" -t "$ACR_LOGIN_SERVER/vote:latest" ./vote
          docker build -t "$RESULT_IMAGE" -t "$ACR_LOGIN_SERVER/result:latest" ./result
          docker build -t "$WORKER_IMAGE" -t "$ACR_LOGIN_SERVER/worker:latest" ./worker

      - name: Push images
        run: |
          VOTE_IMAGE="$ACR_LOGIN_SERVER/vote:$IMAGE_TAG"
          RESULT_IMAGE="$ACR_LOGIN_SERVER/result:$IMAGE_TAG"
          WORKER_IMAGE="$ACR_LOGIN_SERVER/worker:$IMAGE_TAG"

          docker push "$VOTE_IMAGE"
          docker push "$ACR_LOGIN_SERVER/vote:latest"
          docker push "$RESULT_IMAGE"
          docker push "$ACR_LOGIN_SERVER/result:latest"
          docker push "$WORKER_IMAGE"
          docker push "$ACR_LOGIN_SERVER/worker:latest"

      - name: Ensure Container Apps environment exists
        run: |
          az containerapp env show \
            --name "$CONTAINERAPPS_ENVIRONMENT" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            >/dev/null 2>&1 || \
          az containerapp env create \
            --name "$CONTAINERAPPS_ENVIRONMENT" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION"

      - name: Deploy vote app
        run: |
          VOTE_IMAGE="$ACR_LOGIN_SERVER/vote:$IMAGE_TAG"

          if az containerapp show --name "$VOTE_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp registry set \
              --name "$VOTE_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --server "$ACR_LOGIN_SERVER" \
              --username "$ACR_USERNAME" \
              --password "$ACR_PASSWORD"
            az containerapp secret set \
              --name "$VOTE_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets redis-url="$REDIS_CONNECTION_STRING"
            az containerapp update \
              --name "$VOTE_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$VOTE_IMAGE" \
              --set-env-vars \
                OPTION_A="Cats" \
                OPTION_B="Dogs" \
                REDIS_URL="secretref:redis-url"
          else
            az containerapp create \
              --name "$VOTE_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$CONTAINERAPPS_ENVIRONMENT" \
              --image "$VOTE_IMAGE" \
              --registry-server "$ACR_LOGIN_SERVER" \
              --registry-username "$ACR_USERNAME" \
              --registry-password "$ACR_PASSWORD" \
              --target-port 80 \
              --ingress external \
              --secrets redis-url="$REDIS_CONNECTION_STRING" \
              --env-vars \
                OPTION_A="Cats" \
                OPTION_B="Dogs" \
                REDIS_URL="secretref:redis-url"
          fi

      - name: Deploy result app
        run: |
          RESULT_IMAGE="$ACR_LOGIN_SERVER/result:$IMAGE_TAG"

          if az containerapp show --name "$RESULT_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp registry set \
              --name "$RESULT_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --server "$ACR_LOGIN_SERVER" \
              --username "$ACR_USERNAME" \
              --password "$ACR_PASSWORD"
            az containerapp secret set \
              --name "$RESULT_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets database-url="$DATABASE_URL"
            az containerapp update \
              --name "$RESULT_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$RESULT_IMAGE" \
              --set-env-vars DATABASE_URL="secretref:database-url"
          else
            az containerapp create \
              --name "$RESULT_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$CONTAINERAPPS_ENVIRONMENT" \
              --image "$RESULT_IMAGE" \
              --registry-server "$ACR_LOGIN_SERVER" \
              --registry-username "$ACR_USERNAME" \
              --registry-password "$ACR_PASSWORD" \
              --target-port 80 \
              --ingress external \
              --secrets database-url="$DATABASE_URL" \
              --env-vars DATABASE_URL="secretref:database-url"
          fi

      - name: Deploy worker app
        run: |
          WORKER_IMAGE="$ACR_LOGIN_SERVER/worker:$IMAGE_TAG"

          if az containerapp show --name "$WORKER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp registry set \
              --name "$WORKER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --server "$ACR_LOGIN_SERVER" \
              --username "$ACR_USERNAME" \
              --password "$ACR_PASSWORD"
            az containerapp secret set \
              --name "$WORKER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets \
                redis-connection-string="$REDIS_CONNECTION_STRING" \
                postgres-connection-string="$POSTGRES_CONNECTION_STRING"
            az containerapp update \
              --name "$WORKER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$WORKER_IMAGE" \
              --set-env-vars \
                REDIS_CONNECTION_STRING="secretref:redis-connection-string" \
                POSTGRES_CONNECTION_STRING="secretref:postgres-connection-string"
          else
            az containerapp create \
              --name "$WORKER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$CONTAINERAPPS_ENVIRONMENT" \
              --image "$WORKER_IMAGE" \
              --registry-server "$ACR_LOGIN_SERVER" \
              --registry-username "$ACR_USERNAME" \
              --registry-password "$ACR_PASSWORD" \
              --ingress disabled \
              --secrets \
                redis-connection-string="$REDIS_CONNECTION_STRING" \
                postgres-connection-string="$POSTGRES_CONNECTION_STRING" \
              --env-vars \
                REDIS_CONNECTION_STRING="secretref:redis-connection-string" \
                POSTGRES_CONNECTION_STRING="secretref:postgres-connection-string"
          fi

      - name: Show deployed endpoints
        run: |
          az containerapp show \
            --name "$VOTE_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv
          az containerapp show \
            --name "$RESULT_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv
